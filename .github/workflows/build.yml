name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches Gradle home, wrapper, and build cache between runs
      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships with the Android SDK but may be missing API 36.
      # Accepting licenses here lets AGP auto-download any missing platform.
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # local.properties is gitignored; point AGP at the runner's SDK
      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sleepr-aid-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
